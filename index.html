<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#070910">

<title>Истоки — Последний маг</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #070910;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
}

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 600px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            #18223e 0%,
            #0b101c 48%,
            #04060a 100%
        );
}

canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
}

/* HUD */

#hud {
    position: absolute;

    z-index: 3;

    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;

    pointer-events: none;
}

.top {
    display: flex;
    justify-content: space-between;

    gap: 8px;
}

.pill {
    padding: 8px 12px;

    border-radius: 16px;

    background: rgba(21, 27, 43, .72);

    border: 1px solid rgba(255,255,255,.09);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    font-size: 13px;
    font-weight: 700;
}

.bar {
    height: 8px;

    margin-top: 6px;

    border-radius: 9px;

    background: rgba(255,255,255,.10);

    overflow: hidden;
}

.fill {
    height: 100%;

    width: 100%;

    transition: width .12s;
}

.hp {
    background: linear-gradient(
        90deg,
        #ff315b,
        #ff7990
    );
}

.xp {
    background: linear-gradient(
        90deg,
        #5c9dff,
        #a178ff
    );
}

/* JOYSTICK */

#joy {
    display: none;

    position: absolute;

    z-index: 5;

    left: 22px;

    bottom:
        max(
            22px,
            env(safe-area-inset-bottom)
        );

    width: 132px;
    height: 132px;

    border-radius: 50%;

    background: rgba(255,255,255,.07);

    border: 1px solid rgba(255,255,255,.13);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    touch-action: none;
}

#knob {
    position: absolute;

    left: 36px;
    top: 36px;

    width: 60px;
    height: 60px;

    border-radius: 50%;

    background: rgba(255,255,255,.15);

    border: 1px solid rgba(255,255,255,.18);

    box-shadow:
        0 5px 20px rgba(0,0,0,.25);

    pointer-events: none;
}

/* SCREENS */

.overlay {
    position: absolute;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(3,5,9,.72);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}

.card {
    width: min(92%, 440px);

    padding: 26px;

    border-radius: 28px;

    background: rgba(20,26,41,.88);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.small {
    font-size: 12px;

    color: rgba(255,255,255,.48);

    letter-spacing: .8px;
}

.card h1 {
    font-size: 36px;

    margin:
        6px 0 2px;
}

.card h2 {
    margin:
        0 0 10px;
}

.card p {
    color:
        rgba(255,255,255,.68);

    line-height: 1.5;
}

/* BUTTONS */

button {
    appearance: none;
    -webkit-appearance: none;

    position: relative;

    z-index: 20;

    width: 100%;

    padding: 16px;

    margin-top: 10px;

    border: 0;

    border-radius: 18px;

    color: white;

    background:
        rgba(255,255,255,.10);

    font-size: 16px;

    font-weight: 750;

    touch-action: manipulation;

    user-select: none;

    -webkit-user-select: none;

    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.primary {
    background:
        linear-gradient(
            135deg,
            #685cff,
            #4aabff
        );

    box-shadow:
        0 8px 30px
        rgba(82,109,255,.30);
}

.choices {
    display: grid;

    gap: 10px;
}

.choice {
    text-align: left;

    background:
        rgba(255,255,255,.08);
}

.choice b {
    display: block;

    margin-bottom: 5px;
}

.choice span {
    font-size: 13px;

    color:
        rgba(255,255,255,.58);
}

.hidden {
    display: none !important;
}

</style>
</head>

<body>

<div id="game">

    <canvas id="canvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div class="top">

            <div id="time"
                 class="pill">
                00:00
            </div>

            <div id="stats"
                 class="pill">
                Ур. 1 · 0
            </div>

        </div>

        <div class="bar">
            <div id="hp"
                 class="fill hp">
            </div>
        </div>

        <div class="bar">
            <div id="xp"
                 class="fill xp">
            </div>
        </div>

    </div>


    <!-- JOYSTICK -->

    <div id="joy">

        <div id="knob"></div>

    </div>


    <!-- START -->

    <div id="start"
         class="overlay">

        <div class="card">

            <div class="small">
                SWIMFORALL GAMES
            </div>

            <h1>
                ИСТОКИ
            </h1>

            <h2>
                Последний маг
            </h2>

            <p>
                Выживи среди орды.
                Данир атакует автоматически.
                Двигайся джойстиком,
                собирай ману и выбирай
                новые силы.
            </p>

            <button id="startButton"
                    class="primary">

                НАЧАТЬ ЗАБЕГ

            </button>

        </div>

    </div>


    <!-- LEVEL UP -->

    <div id="levelUp"
         class="overlay hidden">

        <div class="card">

            <div class="small">
                НОВЫЙ УРОВЕНЬ
            </div>

            <h2>
                Выбери силу
            </h2>

            <div id="choices"
                 class="choices">
            </div>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver"
         class="overlay hidden">

        <div class="card">

            <div class="small">
                РУНЫ ПОГАСЛИ
            </div>

            <h1>
                Ты пал
            </h1>

            <p id="result">
            </p>

            <button id="restartButton"
                    class="primary">

                НОВЫЙ ЗАБЕГ

            </button>

        </div>

    </div>

</div>


<script>

(() => {

"use strict";


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const game =
    document.getElementById("game");


let W = 0;
let H = 0;
let DPR = 1;


function resize() {

    W = game.clientWidth;
    H = game.clientHeight;

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;

    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   UI
===================================================== */

const UI = {

    start:
        document.getElementById(
            "start"
        ),

    levelUp:
        document.getElementById(
            "levelUp"
        ),

    gameOver:
        document.getElementById(
            "gameOver"
        ),

    startButton:
        document.getElementById(
            "startButton"
        ),

    restartButton:
        document.getElementById(
            "restartButton"
        ),

    choices:
        document.getElementById(
            "choices"
        ),

    time:
        document.getElementById(
            "time"
        ),

    stats:
        document.getElementById(
            "stats"
        ),

    hp:
        document.getElementById(
            "hp"
        ),

    xp:
        document.getElementById(
            "xp"
        ),

    result:
        document.getElementById(
            "result"
        ),

    joy:
        document.getElementById(
            "joy"
        ),

    knob:
        document.getElementById(
            "knob"
        )

};


/* =====================================================
   GAME STATE
===================================================== */

let running = false;
let paused = false;

let lastTime = 0;

let elapsed = 0;

let spawnTimer = 0;

let shotTimer = 0;

let level = 1;

let experience = 0;

let nextExperience = 7;

let kills = 0;


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x: 0,
    y: 0,

    radius: 15,

    invulnerable: 0

};


/* =====================================================
   ARRAYS
===================================================== */

let enemies = [];
let projectiles = [];
let mana = [];
let particles = [];


/* =====================================================
   UPGRADES
===================================================== */

let stats = {

    damage: 1,

    attackRate: 1,

    projectiles: 1,

    speed: 1,

    magnet: 1,

    hp: 100,

    maxHp: 100

};


/* =====================================================
   INPUT
===================================================== */

const input = {

    x: 0,
    y: 0

};


let joystickPointer = null;


function setJoystick(
    clientX,
    clientY
) {

    const rect =
        UI.joy.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        clientX - centerX;

    let dy =
        clientY - centerY;

    const maxDistance = 43;

    const distance =
        Math.hypot(
            dx,
            dy
        ) || 1;

    const strength =
        Math.min(
            1,
            distance /
            maxDistance
        );

    input.x =
        dx /
        distance *
        strength;

    input.y =
        dy /
        distance *
        strength;

    UI.knob.style.transform =
        `translate(
            ${input.x * maxDistance}px,
            ${input.y * maxDistance}px
        )`;

}


/* =====================================================
   JOYSTICK TOUCH
===================================================== */

UI.joy.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        joystickPointer =
            event.pointerId;

        UI.joy.setPointerCapture(
            event.pointerId
        );

        setJoystick(
            event.clientX,
            event.clientY
        );

    }
);


UI.joy.addEventListener(
    "pointermove",
    event => {

        if (
            event.pointerId !==
            joystickPointer
        ) {
            return;
        }

        event.preventDefault();

        setJoystick(
            event.clientX,
            event.clientY
        );

    }
);


function releaseJoystick(event) {

    if (
        event.pointerId !==
        joystickPointer
    ) {
        return;
    }

    joystickPointer = null;

    input.x = 0;
    input.y = 0;

    UI.knob.style.transform =
        "translate(0,0)";

}


UI.joy.addEventListener(
    "pointerup",
    releaseJoystick
);

UI.joy.addEventListener(
    "pointercancel",
    releaseJoystick
);


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowLeft" ||
            event.key.toLowerCase() === "a"
        ) {
            input.x = -1;
        }

        if (
            event.key === "ArrowRight" ||
            event.key.toLowerCase() === "d"
        ) {
            input.x = 1;
        }

        if (
            event.key === "ArrowUp" ||
            event.key.toLowerCase() === "w"
        ) {
            input.y = -1;
        }

        if (
            event.key === "ArrowDown" ||
            event.key.toLowerCase() === "s"
        ) {
            input.y = 1;
        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        if (
            [
                "ArrowLeft",
                "ArrowRight",
                "a",
                "d"
            ].includes(
                event.key
            )
        ) {
            input.x = 0;
        }

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "w",
                "s"
            ].includes(
                event.key
            )
        ) {
            input.y = 0;
        }

    }
);


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    elapsed = 0;

    spawnTimer = 0;

    shotTimer = 0;

    level = 1;

    experience = 0;

    nextExperience = 7;

    kills = 0;

    enemies = [];

    projectiles = [];

    mana = [];

    particles = [];

    stats = {

        damage: 1,

        attackRate: 1,

        projectiles: 1,

        speed: 1,

        magnet: 1,

        hp: 100,

        maxHp: 100

    };

    player.x =
        W / 2;

    player.y =
        H / 2;

    player.invulnerable =
        0;

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    resetGame();

    running = true;

    paused = false;

    UI.start.classList.add(
        "hidden"
    );

    UI.levelUp.classList.add(
        "hidden"
    );

    UI.gameOver.classList.add(
        "hidden"
    );

    UI.joy.style.display =
        "block";

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   BUTTONS
===================================================== */

let buttonLock = false;


function safeStart() {

    if (buttonLock) {
        return;
    }

    buttonLock = true;

    startGame();

    setTimeout(
        () => {
            buttonLock = false;
        },
        400
    );

}


UI.startButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        safeStart();

    }
);


UI.startButton.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        safeStart();

    },
    {
        passive: false
    }
);


UI.startButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        safeStart();

    }
);


UI.restartButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        safeStart();

    }
);


UI.restartButton.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        safeStart();

    },
    {
        passive: false
    }
);


UI.restartButton.addEventListener(
    "click",
    event => {

        event.preventDefault();

        safeStart();

    }
);


/* =====================================================
   ENEMY SPAWN
===================================================== */

function spawnEnemy() {

    const side =
        Math.floor(
            Math.random() * 4
        );

    const margin = 50;

    let x;
    let y;

    if (side === 0) {

        x =
            Math.random() * W;

        y =
            -margin;

    }

    else if (side === 1) {

        x =
            W + margin;

        y =
            Math.random() * H;

    }

    else if (side === 2) {

        x =
            Math.random() * W;

        y =
            H + margin;

    }

    else {

        x =
            -margin;

        y =
            Math.random() * H;

    }


    const elite =
        Math.random() >
        0.94;


    const hp =
        2 +
        Math.floor(
            elapsed / 35
        );


    enemies.push({

        x,
        y,

        radius:
            elite
                ? 16
                : 10 + Math.random() * 5,

        hp:
            elite
                ? hp * 3
                : hp,

        maxHp:
            elite
                ? hp * 3
                : hp,

        speed:
            (
                elite
                    ? 35
                    : 42
            ) +
            Math.random() * 20 +
            elapsed * .3,

        elite

    });

}


/* =====================================================
   FIND NEAREST
===================================================== */

function nearestEnemy() {

    let nearest = null;

    let nearestDistance =
        Infinity;


    for (
        const enemy of enemies
    ) {

        const dx =
            enemy.x -
            player.x;

        const dy =
            enemy.y -
            player.y;

        const distance =
            dx * dx +
            dy * dy;


        if (
            distance <
            nearestDistance
        ) {

            nearestDistance =
                distance;

            nearest =
                enemy;

        }

    }


    return nearest;

}


/* =====================================================
   ATTACK
===================================================== */

function attack() {

    const target =
        nearestEnemy();

    if (!target) {
        return;
    }


    const angle =
        Math.atan2(
            target.y -
            player.y,

            target.x -
            player.x
        );


    const amount =
        stats.projectiles;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const spread =
            amount === 1
                ? 0
                : (
                    i -
                    (amount - 1) / 2
                ) * .20;


        const finalAngle =
            angle +
            spread;


        projectiles.push({

            x:
                player.x,

            y:
                player.y,

            vx:
                Math.cos(
                    finalAngle
                ) * 440,

            vy:
                Math.sin(
                    finalAngle
                ) * 440,

            radius: 5,

            damage:
                9 *
                stats.damage

        });

    }

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    amount = 6
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            30 +
            Math.random() * 90;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:
                .35 +
                Math.random() *
                .4

        });

    }

}


/* =====================================================
   EXPERIENCE
===================================================== */

function gainExperience(
    amount
) {

    experience +=
        amount;


    while (
        experience >=
        nextExperience
    ) {

        experience -=
            nextExperience;

        nextExperience =
            Math.floor(
                nextExperience *
                1.32 +
                2
            );

        level++;

        showLevelUp();

    }

}


/* =====================================================
   LEVEL UP
===================================================== */

function showLevelUp() {

    paused = true;

    const upgrades = [

        [
            "Руна силы",
            "Урон +25%",
            "damage"
        ],

        [
            "Руна скорости",
            "Атака происходит на 20% чаще",
            "attackRate"
        ],

        [
            "Раздвоение",
            "Дополнительный снаряд",
            "projectiles"
        ],

        [
            "Руна движения",
            "Скорость движения +15%",
            "speed"
        ],

        [
            "Кровь источника",
            "Максимальное HP +25 и лечение",
            "maxHp"
        ]

    ];


    upgrades.sort(
        () => Math.random() - .5
    );


    const selected =
        upgrades.slice(
            0,
            3
        );


    UI.choices.innerHTML =
        "";


    selected.forEach(
        upgrade => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "choice";


            button.innerHTML = `

                <b>
                    ${upgrade[0]}
                </b>

                <span>
                    ${upgrade[1]}
                </span>

            `;


            button.addEventListener(
                "pointerup",
                event => {

                    event.preventDefault();

                    applyUpgrade(
                        upgrade[2]
                    );

                    UI.levelUp.classList.add(
                        "hidden"
                    );

                    paused = false;

                    lastTime =
                        performance.now();

                }
            );


            UI.choices.appendChild(
                button
            );

        }
    );


    UI.levelUp.classList.remove(
        "hidden"
    );

}


/* =====================================================
   APPLY UPGRADE
===================================================== */

function applyUpgrade(
    type
) {

    if (
        type ===
        "maxHp"
    ) {

        stats.maxHp += 25;

        stats.hp =
            Math.min(
                stats.maxHp,
                stats.hp + 35
            );

        return;

    }


    stats[type]++;

}


/* =====================================================
   PLAYER DAMAGE
===================================================== */

function damagePlayer(
    damage
) {

    if (
        player.invulnerable >
        0
    ) {
        return;
    }


    stats.hp -=
        damage;


    player.invulnerable =
        .65;


    createParticles(
        player.x,
        player.y,
        10
    );


    if (
        stats.hp <= 0
    ) {

        endGame();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    running = false;

    UI.joy.style.display =
        "none";


    UI.result.textContent =

        `Время: ${formatTime(elapsed)}
         · врагов уничтожено: ${kills}
         · уровень: ${level}`;


    UI.gameOver.classList.remove(
        "hidden"
    );

}


/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    seconds
) {

    seconds =
        Math.floor(
            seconds
        );


    const minutes =
        String(
            Math.floor(
                seconds / 60
            )
        ).padStart(
            2,
            "0"
        );


    const secs =
        String(
            seconds % 60
        ).padStart(
            2,
            "0"
        );


    return (
        minutes +
        ":" +
        secs
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(
    delta
) {

    elapsed +=
        delta;


    player.invulnerable =
        Math.max(
            0,
            player.invulnerable -
            delta
        );


    /* PLAYER */

    const inputLength =
        Math.hypot(
            input.x,
            input.y
        );


    if (
        inputLength >
        0
    ) {

        const speed =
            175 *
            (
                1 +
                (
                    stats.speed -
                    1
                ) *
                .15
            );


        player.x +=
            input.x /
            inputLength *
            speed *
            delta;


        player.y +=
            input.y /
            inputLength *
            speed *
            delta;

    }


    /* BOUNDS */

    player.x =
        Math.max(
            16,
            Math.min(
                W - 16,
                player.x
            )
        );


    player.y =
        Math.max(
            70,
            Math.min(
                H - 16,
                player.y
            )
        );


    /* SPAWN */

    spawnTimer -=
        delta;


    const spawnInterval =
        Math.max(
            .18,
            .78 -
            elapsed *
            .006
        );


    if (
        spawnTimer <=
        0
    ) {

        spawnEnemy();

        spawnTimer =
            spawnInterval;

    }


    /* ATTACK */

    shotTimer -=
        delta;


    if (
        shotTimer <=
        0
    ) {

        attack();

        shotTimer =
            Math.max(
                .16,
                .72 /
                stats.attackRate
            );

    }


    /* ENEMIES */

    for (
        let i =
            enemies.length - 1;

        i >= 0;

        i--
    ) {

        const enemy =
            enemies[i];


        const dx =
            player.x -
            enemy.x;

        const dy =
            player.y -
            enemy.y;


        const distance =
            Math.hypot(
                dx,
                dy
            ) || 1;


        enemy.x +=
            dx /
            distance *
            enemy.speed *
            delta;


        enemy.y +=
            dy /
            distance *
            enemy.speed *
            delta;


        if (
            distance <
            enemy.radius +
            player.radius
        ) {

            damagePlayer(
                enemy.elite
                    ? 16
                    : 8
            );

        }

    }


    /* PROJECTILES */

    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {

        const projectile =
            projectiles[i];


        projectile.x +=
            projectile.vx *
            delta;


        projectile.y +=
            projectile.vy *
            delta;


        let hit =
            false;


        for (
            let j =
                enemies.length - 1;

            j >= 0;

            j--
        ) {

            const enemy =
                enemies[j];


            const distance =
                Math.hypot(
                    projectile.x -
                    enemy.x,

                    projectile.y -
                    enemy.y
                );


            if (
                distance <
                projectile.radius +
                enemy.radius
            ) {

                enemy.hp -=
                    projectile.damage;


                hit = true;


                createParticles(
                    projectile.x,
                    projectile.y,
                    2
                );


                if (
                    enemy.hp <= 0
                ) {

                    kills++;


                    mana.push({

                        x:
                            enemy.x,

                        y:
                            enemy.y,

                        radius: 5,

                        value:
                            enemy.elite
                                ? 4
                                : 1

                    });


                    createParticles(
                        enemy.x,
                        enemy.y,
                        enemy.elite
                            ? 14
                            : 5
                    );


                    enemies.splice(
                        j,
                        1
                    );

                }


                break;

            }

        }


        if (
            hit ||
            projectile.x <
                -40 ||
            projectile.x >
                W + 40 ||
            projectile.y <
                -40 ||
            projectile.y >
                H + 40
        ) {

            projectiles.splice(
                i,
                1
            );

        }

    }


    /* MANA */

    for (
        let i =
            mana.length - 1;

        i >= 0;

        i--
    ) {

        const crystal =
            mana[i];


        const dx =
            player.x -
            crystal.x;

        const dy =
            player.y -
            crystal.y;


        const distance =
            Math.hypot(
                dx,
                dy
            ) || 1;


        const magnetRadius =
            45 *
            stats.magnet;


        if (
            distance <
            magnetRadius
        ) {

            crystal.x +=
                dx /
                distance *
                260 *
                delta;


            crystal.y +=
                dy /
                distance *
                260 *
                delta;

        }


        if (
            distance <
            25
        ) {

            gainExperience(
                crystal.value
            );


            createParticles(
                crystal.x,
                crystal.y,
                3
            );


            mana.splice(
                i,
                1
            );

        }

    }


    /* PARTICLES */

    for (
        let i =
            particles.length - 1;

        i >= 0;

        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx *
            delta;


        particle.y +=
            particle.vy *
            delta;


        particle.life -=
            delta;


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

        }

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* GRID */

    ctx.save();

    ctx.globalAlpha =
        .12;

    ctx.strokeStyle =
        "#93a7dd";

    const offset =
        (
            elapsed *
            18
        ) % 48;


    for (
        let x =
            -48 + offset;

        x <
            W + 48;

        x += 48
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            55
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();

    }


    for (
        let y =
            55 - offset;

        y <
            H;

        y += 48
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            W,
            y
        );

        ctx.stroke();

    }


    ctx.restore();


    /* MANA */

    for (
        const crystal of mana
    ) {

        ctx.beginPath();

        ctx.fillStyle =
            "#66c9ff";

        ctx.shadowBlur =
            14;

        ctx.shadowColor =
            "#66c9ff";

        ctx.arc(
            crystal.x,
            crystal.y,
            crystal.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;

    }


    /* PROJECTILES */

    for (
        const projectile of projectiles
    ) {

        ctx.beginPath();

        ctx.fillStyle =
            "#bca9ff";

        ctx.shadowBlur =
            16;

        ctx.shadowColor =
            "#8e74ff";

        ctx.arc(
            projectile.x,
            projectile.y,
            projectile.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.shadowBlur =
            0;

    }


    /* ENEMIES */

    for (
        const enemy of enemies
    ) {

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );


        const angle =
            Math.atan2(
                player.y -
                enemy.y,

                player.x -
                enemy.x
            );


        ctx.rotate(
            angle
        );


        ctx.fillStyle =
            enemy.elite
                ? "#b04491"
                : "#713b65";


        ctx.shadowBlur =
            enemy.elite
                ? 18
                : 8;


        ctx.shadowColor =
            "#d34d91";


        ctx.beginPath();

        ctx.moveTo(
            enemy.radius,
            0
        );

        ctx.lineTo(
            -enemy.radius * .7,
            enemy.radius * .7
        );

        ctx.lineTo(
            -enemy.radius * .4,
            0
        );

        ctx.lineTo(
            -enemy.radius * .7,
            -enemy.radius * .7
        );

        ctx.closePath();

        ctx.fill();


        ctx.restore();


        /* ENEMY HP */

        if (
            enemy.hp <
            enemy.maxHp
        ) {

            ctx.fillStyle =
                "rgba(255,255,255,.15)";


            ctx.fillRect(
                enemy.x -
                enemy.radius,

                enemy.y -
                enemy.radius -
                7,

                enemy.radius *
                2,

                3
            );


            ctx.fillStyle =
                "#ff668f";


            ctx.fillRect(
                enemy.x -
                enemy.radius,

                enemy.y -
                enemy.radius -
                7,

                enemy.radius *
                2 *
                (
                    enemy.hp /
                    enemy.maxHp
                ),

                3
            );

        }

    }


    /* PLAYER */

    ctx.save();


    if (
        player.invulnerable >
        0 &&
        Math.floor(
            player.invulnerable *
            12
        ) % 2
    ) {

        ctx.globalAlpha =
            .3;

    }


    ctx.fillStyle =
        "#e7edff";


    ctx.shadowBlur =
        28;

    ctx.shadowColor =
        "#718fff";


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur =
        0;


    /* RUNE RING */

    ctx.strokeStyle =
        "#7568ff";

    ctx.lineWidth =
        3;


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        24,

        elapsed * 2,

        elapsed * 2 +
        4.7
    );

    ctx.stroke();


    /* CORE */

    ctx.fillStyle =
        "#202a4c";


    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.restore();


    /* PARTICLES */

    for (
        const particle of particles
    ) {

        ctx.globalAlpha =
            Math.max(
                0,
                particle.life *
                1.8
            );


        ctx.fillStyle =
            "#9aa7ff";


        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha =
        1;

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(
    currentTime
) {

    if (!running) {
        return;
    }


    const delta =
        Math.min(
            .033,
            (
                currentTime -
                lastTime
            ) / 1000
        );


    lastTime =
        currentTime;


    if (!paused) {

        update(
            delta
        );

        draw();


        UI.time.textContent =
            formatTime(
                elapsed
            );


        UI.stats.textContent =
            `Ур. ${level} · ${kills}`;


        UI.hp.style.width =
            Math.max(
                0,
                stats.hp /
                stats.maxHp *
                100
            ) + "%";


        UI.xp.style.width =
            (
                experience /
                nextExperience *
                100
            ) + "%";

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

resetGame();

})();

</script>
